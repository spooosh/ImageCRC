name: ImageCRC
options:
  bundleIdPrefix: com.spooosh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.3.2

targets:
  ImageCRC:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Views
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: ImageCRC
        CFBundleDisplayName: ImageCRC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: com.spooosh.image-crc
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 spooosh"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSQuitAlwaysKeepsWindows: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spooosh.image-crc
        PRODUCT_MODULE_NAME: ImageCRC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: libwebp
        product: libwebp

  ImageCRCTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/Support
      - path: Tests/UnitTests
      - path: Tests/CodecTests
      - path: Tests/IntegrationTests
    dependencies:
      - target: ImageCRC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: ImageCRCTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ImageCRC.app/Contents/MacOS/ImageCRC

  ImageCRCUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: ImageCRC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: ImageCRCUITests
        TEST_TARGET_NAME: ImageCRC
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ImageCRC:
    build:
      targets:
        ImageCRC: all
        ImageCRCTests: [test]
        ImageCRCUITests: [test]
    test:
      config: Debug
      targets:
        - ImageCRCTests
        - ImageCRCUITests
    run:
      config: Debug
    archive:
      config: Release
