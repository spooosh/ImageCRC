name: img-cc
options:
  bundleIdPrefix: com.spooosh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_MODULE_NAME: ImgCC
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: 1.3.2

targets:
  img-cc:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Views
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: img-cc
        CFBundleDisplayName: img-cc
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: com.spooosh.img-cc
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 spooosh"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.graphics-design
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSQuitAlwaysKeepsWindows: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spooosh.img-cc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: libwebp
        product: libwebp

schemes:
  img-cc:
    build:
      targets:
        img-cc: all
    run:
      config: Debug
    archive:
      config: Release
