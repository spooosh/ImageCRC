name: Test

on:
  push:
    # Only main — feature branches like `tests/**` are covered by the
    # pull_request trigger below, so listing them here would double-fire
    # CI for every PR push (concurrency.cancel-in-progress can't dedupe
    # across the two trigger types because their github.ref differs).
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      IMAGECRC_TEST_REQUIRE_PNGQUANT: "1"
      # AVIF software encoding on virtualised macos-14 runners (no hardware
      # AV1) can take minutes per file — even 4 quality cases blow past
      # job-timeout. Skip AVIF encode tests on CI; they remain enabled
      # locally where Apple Silicon hardware AV1 keeps them sub-second.
      IMAGECRC_TEST_SKIP_AVIF: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 16+ for Swift Testing framework
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode 16 found on runner; \`import Testing\` requires Xcode 16+"
            ls /Applications/ | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$LATEST"

      - name: Cache SwiftPM build artefacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Install pngquant and xcodegen
        run: brew install pngquant xcodegen

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version
          pngquant --version
          xcodegen --version

      - name: swift test
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ImageCRC.xcodeproj \
            -scheme ImageCRC \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
