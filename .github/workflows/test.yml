name: Test

on:
  push:
    # Only main — feature branches like `tests/**` are covered by the
    # pull_request trigger below, so listing them here would double-fire
    # CI for every PR push (concurrency.cancel-in-progress can't dedupe
    # across the two trigger types because their github.ref differs).
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      IMAGECRC_TEST_REQUIRE_PNGQUANT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 16+ for Swift Testing framework
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode 16 found on runner; \`import Testing\` requires Xcode 16+"
            ls /Applications/ | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$LATEST"

      - name: Cache SwiftPM build artefacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Install pngquant and xcodegen
        run: brew install pngquant xcodegen

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version
          pngquant --version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # Drive both SwiftPM-side tests (ImageCRCTests target) and the
      # XCUITest UI smoke (ImageCRCUITests) via xcodebuild rather than
      # `swift test`. SwiftPM's `swiftpm-testing` runner hangs silently
      # post-build on the macos-14 GH runner — never starts streaming
      # test events, never exits — even with AVIF gated off. Xcode's
      # test runner manages NSApplication lifecycle and avoids whatever
      # the hang is. This also drops a redundant double-run since
      # xcodebuild already exercises the same SwiftPM test target.
      - name: xcodebuild test
        run: |
          set -o pipefail
          # AVIF and HEIC encode tests require hardware codecs (AV1 / HEVC)
          # that virtualised macos-14 GH runners lack — the AppleAVEVA
          # IOService doesn't exist, so encode fails immediately.
          # Pngquant tests are env-gated to enabled when the binary is
          # available (brew installs it above).
          # xcodebuild does not propagate process-level env into the test
          # runner — `TEST_RUNNER_<NAME>` build settings are the supported
          # path; Xcode strips the prefix when launching the runner.
          xcodebuild test \
            -project ImageCRC.xcodeproj \
            -scheme ImageCRC \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/TestResults.xcresult \
            TEST_RUNNER_IMAGECRC_TEST_REQUIRE_PNGQUANT=1 \
            TEST_RUNNER_IMAGECRC_TEST_SKIP_AVIF=1 \
            TEST_RUNNER_IMAGECRC_TEST_SKIP_HEIC=1

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
