name: Test

on:
  push:
    branches:
      - main
      - "tests/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      IMAGECRC_TEST_REQUIRE_PNGQUANT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build artefacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Install pngquant and xcodegen
        run: brew install pngquant xcodegen

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version
          pngquant --version
          xcodegen --version

      - name: swift test
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ImageCRC.xcodeproj \
            -scheme ImageCRC \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
